schema_version: 1
status: standing_qualification
algorithm: brax_ppo
seed: 0

environment:
  control_timestep: 0.01
  foot_condim: 6
  safe_reward: true
  bounded_observations: true
  randomized_reset: true

reward:
  profile: smooth_height_velocity_pose_v1
  termination_cost: 2.0
  height_sigma: 0.02
  linear_velocity_sigma: 0.25
  angular_velocity_sigma: 0.25
  linear_velocity_scale: 1.0
  angular_velocity_scale: 0.5
  pose_scale: 0.5
  alive_scale: 0.1
  action_cost_scale: 0.001
  action_rate_cost_scale: 0.01

ppo:
  num_timesteps: 1048576
  num_envs: 64
  episode_length: 1000
  unroll_length: 4
  batch_size: 16
  num_minibatches: 4
  num_updates_per_batch: 2
  learning_rate: 0.0001
  learning_rate_schedule: ADAPTIVE_KL
  desired_kl: 0.01
  max_grad_norm: 1.0
  entropy_cost: 0.001
  discounting: 0.97
  normalize_observations: true

rocm_guardrails:
  max_physics_substeps_per_control: 5
  max_training_steps_per_host_call: 2
  brax_run_evals: false

manual_evaluation:
  enabled: true
  seed: 777
  num_envs: 64
  num_steps: 50
  repeat_count: 8
  height_tolerance: 0.2
  implementation: sequential_python_loop

checkpoint:
  scope: full_training_session
  interval_steps: 1048576
  includes_rollout_state: true
  policy_snapshot_scope: inference_params
  policy_snapshot_interval_steps: 131072

precision:
  status: pending_multi_seed_ab
  candidates:
    - default
    - highest
