[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "amd-robo"
version = "0.1.0"
description = "ROCm-first quadruped mobile manipulation with MuJoCo MJX"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
amd-robo-smoke = "amd_robo.platform.smoke:main"
amd-robo-system-info = "amd_robo.platform.system_info:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "mjx: requires MuJoCo MJX",
  "rocm: requires an AMD ROCm device",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
